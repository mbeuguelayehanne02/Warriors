<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Login Form</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            margin-top: 100px;
        }

        .container{
            width: 300px;
            margin: auto;
            padding: 20px;
            background: white;
            border: 1px solid black;
            border-radius: 10px;
        }

        input, select{
            width: 90%;
            padding: 8px;
            margin: 10px 0;
        }

        button{
            padding: 10px 20px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover{
            background: darkblue;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Connexion</h2>

        <form action="welcome.html">

            <input type="text" placeholder="Login" required>

            <input type="password" placeholder="Password" required>

            <select>
                <option>Choisir Profil</option>
                <option>Etudiant</option>
                <option>Secrétaire</option>
                <option>Administrateur</option>
            </select>

            <br>
            <button type="submit">Connexion</button><br>
            <a href="inscription.html"

        </form>
    </div>

</body>
</html>
