
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire d'inscription</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #7d4b09;
        }

        .formulaire {
            width: 400px;
            margin: 40px auto;
            padding: 20px;
            background: rgb(181, 186, 128);
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
        }

        label {
            display: inline-block;
            width: 100px;
        }

        input, select {
            width: 200px;
            margin-bottom: 10px;
        }

        .radio input {
            width: auto;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: darkgreen;
        }
    </style>
</head>

<body>

    <div class="formulaire">
        <h2>Inscription</h2>

        <form>
            <label for="prenom">Prénom :</label>
            <input type="text" name="prenom" id="prenom">

            <label>Nom :</label>
            <input type="text" name="nom">

            <label>Login :</label>
            <input type="text" name="login">

            <label for="password"> Password  :</label>
            <input type="password" name="password"id="password">
            <label> Profile :</label>
            <select name="Profile">
                <option>Autre</option>
                <option>etudiant</option>
                <option>administrateur</option>
                <option>sécrétaire</option>
            </select>
            <label for="sexe">Sexe :</label>
            <div class="radio">
                <input type="radio" name="sexe" value="Homme"> 
                <label for="Homme"> Homme </label>
                <input type="radio" name="sexe" value="Femme"> 
                <label for="Femme"> Femme </label>
             </div>
        

            <label>Nationalité :</label>
            <select name="nationalite">
                <option>Française</option>
                <option>Américaine</option>
                <option>japonnaise</option>
                <option> Guinéenne</option>
                <option>Somalienne</option>
                <option>Italienne</option>
                <option>Canadienne</option>
                <option> Indienne</option>
            </select>
            </select>

            <button type="submit">Enregistrer</button>
        </form>
    </div>

</body>
</html>
